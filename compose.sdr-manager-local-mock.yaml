# sdr-manager-local with no dongle: two simulated RTL-SDRs (ADR 0007).
#
# For developing and testing SDR Manager on any machine — a Mac, CI, a laptop
# with nothing plugged in. Layered over docker-compose.yml, it runs the same
# image on the compose network instead of the host's, unprivileged, with no
# USB bus or D-Bus, and SDR_MANAGER_LOCAL_HARDWARE=fake (the simulated
# adapters: services/sdr-manager-local/backend/sentinel_sdr_manager_local/
# adapters/simulated_hardware.py). Nothing streams IQ.
#
#   docker compose -f docker-compose.yml -f compose.sdr-manager-local-mock.yaml \
#     --profile sdr-manager-local up -d --build
#
# The SDR Manager API is then at http://localhost:8080/api/sdr-manager/local/
# through the gateway; it is not published on the host.

services:
  sdr-manager-local:
    network_mode: !reset null
    privileged: false
    device_cgroup_rules: !reset []
    networks:
      - sentinel
    expose:
      - "8000"
    volumes: !override
      - sdr_manager_local_data:/data
      - ./frontend/spa-dist:/app/frontend/spa-dist:ro
      - ./backend:/app/backend
      - ./services/sdr-manager-local/backend:/app/services/sdr-manager-local/backend
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: credentials/sdr-manager-local}}
    environment:
      SDR_MANAGER_LOCAL_HARDWARE: fake
      # On the compose network it binds the container's own port 8000 whatever
      # .env says, since nothing else is on this container's network stack.
      SDR_MANAGER_LOCAL_HTTP_PORT: "8000"
      # Core's TLS service entrypoint by its compose name (its certificate
      # covers `gateway`), and its own address on this network.
      SENTINEL_CORE_URL: https://gateway:8443
      SERVICE_INTERNAL_URL: http://sdr-manager-local:8000
