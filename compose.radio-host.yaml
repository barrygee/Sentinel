# A radio host: the radio hub and its decoders on a second machine, next to the
# dongles, driving a Sentinel core that runs elsewhere (section-containers plan
# §4.6, P7.5). See docs/radio-host.md for the full walkthrough.
#
#   docker compose -f compose.radio-host.yaml run --rm -T credentials-import < radio-host-credentials.tar.gz
#   docker compose -f compose.radio-host.yaml --profile aprs up -d --build
#
# Everything that crosses the LAN is TLS with the deployment's own CA:
#   radio host → core   the hub registers, reads settings and secrets through
#                       core's service entrypoint (SENTINEL_CORE_ENTRYPOINT_URL)
#                       and joins core's NATS (SENTINEL_CORE_NATS_URL);
#   core → radio host   core's gateway (browser traffic, /ws/sdr/*), its health
#                       probes and the SDR section's IQ-capture copies reach the
#                       hub through radio-host-gateway (SENTINEL_RADIO_HOST_URL).
# The decoders talk to the hub over this host's own compose network only, so
# no PCM port and no decoder credential ever leaves this machine.
#
# Needs (in this host's .env): SENTINEL_CORE_ENTRYPOINT_URL, SENTINEL_CORE_NATS_URL
# and SENTINEL_RADIO_HOST_URL. On the core host: SENTINEL_RADIO_HUB_REPLICAS=0
# (so it starts no hub of its own), no decoder profiles, the entrypoint and
# NATS published (SENTINEL_SERVICE_ENTRYPOINT_ADDRESS, NATS_PUBLISHED_ADDRESS)
# and both hosts' names in SENTINEL_CORE_HOSTNAMES / SENTINEL_RADIO_HOST_HOSTNAMES.

name: sentinel-radio-host

x-decoder-credentials-env: &decoder-env
  # The hub, straight over this host's compose network (it serves the decoder
  # endpoints itself), rather than core's gateway across the LAN.
  SENTINEL_GATEWAY_URL: http://radio-hub:8000
  DECODER_CREDENTIALS_FILE: /run/service-credentials/http-credentials.json

services:
  # One-shot: unpacks the bundle exported on the core host into this host's
  # credentials volume. Never started by `up` (profile `import`); run it with
  # `run --rm -T credentials-import < bundle`.
  credentials-import:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["import"]
    stdin_open: true
    volumes:
      - radio_host_credentials:/run/service-credentials
    environment:
      SENTINEL_WRITABLE_DIRECTORIES: /run/service-credentials
      SENTINEL_RUNTIME_USER_ID: ${SENTINEL_RUNTIME_USER_ID:-1000}
      SENTINEL_RUNTIME_GROUP_ID: ${SENTINEL_RUNTIME_GROUP_ID:-1000}
    command: ["python", "-m", "backend.scripts.service_credentials_bundle", "import", "/run/service-credentials"]
    healthcheck:
      disable: true
    restart: "no"

  radio-hub:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # It dials rtl_tcp and Sentry hosts, possibly on this machine itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radio_hub_data:/app/data
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/radio-hub}}
    environment:
      PYTHONUNBUFFERED: "1"
      DB_PATH: /app/data/radio-hub.db
      SENTINEL_CORE_URL: ${SENTINEL_CORE_ENTRYPOINT_URL:?set SENTINEL_CORE_ENTRYPOINT_URL, e.g. https://core.lan:8443}
      NATS_URL: ${SENTINEL_CORE_NATS_URL:?set SENTINEL_CORE_NATS_URL, e.g. tls://core.lan:4222}
      # What it registers: core's gateway and the SDR section reach it here.
      SERVICE_INTERNAL_URL: ${SENTINEL_RADIO_HOST_URL:?set SENTINEL_RADIO_HOST_URL, e.g. https://radio.lan:8443}
      # Its decoders are on this compose network: they dial `radio-hub`.
      DECODER_SOCKETS_HOST: radio-hub
      # It stops any raw-IQ capture this old; keep it equal to core's (docs/operations.md).
      SDR_RECORDING_MAX_DURATION_S: ${SDR_RECORDING_MAX_DURATION_S:-21600}
      SERVICE_HTTP_CREDENTIALS_FILE: /run/service-credentials/http-credentials.json
      ACCEPTED_CALLERS_FILE: /run/service-credentials/accepted-callers.json
      NATS_CREDENTIALS_FILE: /run/service-credentials/nats-credentials.json
      NATS_CERTIFICATE_AUTHORITY_FILE: /run/service-credentials/certificate-authority.pem
      INTERNAL_CERTIFICATE_AUTHORITY_FILE: /run/service-credentials/certificate-authority.pem
      SENTINEL_RUNTIME_USER_ID: ${SENTINEL_RUNTIME_USER_ID:-1000}
      SENTINEL_RUNTIME_GROUP_ID: ${SENTINEL_RUNTIME_GROUP_ID:-1000}
    command: uvicorn backend.standalone.radio_hub:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - radio-host

  # TLS in front of the hub, with the certificate core's service-credentials
  # issued for SENTINEL_RADIO_HOST_HOSTNAMES. The only port this host publishes.
  radio-host-gateway:
    image: caddy:2.10-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    ports:
      - "${SENTINEL_RADIO_HOST_GATEWAY_ADDRESS:-8443}:8443"
    volumes:
      - ./gateway/radio-host-caddy.json:/etc/caddy/caddy.json:ro
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/radio-host-gateway}}
    user: "${SENTINEL_RUNTIME_USER_ID:-1000}:${SENTINEL_RUNTIME_GROUP_ID:-1000}"
    read_only: true
    tmpfs:
      - /data:uid=${SENTINEL_RUNTIME_USER_ID:-1000},gid=${SENTINEL_RUNTIME_GROUP_ID:-1000}
      - /config:uid=${SENTINEL_RUNTIME_USER_ID:-1000},gid=${SENTINEL_RUNTIME_GROUP_ID:-1000}
    depends_on:
      - radio-hub
    restart: unless-stopped
    networks:
      - radio-host

  # The decoders, opt-in by profile exactly as on the core host.
  voice-decoder:
    build:
      context: ./decoder
      dockerfile: Dockerfile
    profiles: ["voice-decoder", "all"]
    environment: *decoder-env
    volumes:
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/voice-decoder}}
    depends_on:
      - radio-hub
    restart: unless-stopped
    networks:
      - radio-host

  aprs-decoder:
    build:
      context: ./decoder/aprs
      dockerfile: Dockerfile
    profiles: ["aprs", "all"]
    environment: *decoder-env
    volumes:
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/aprs-decoder}}
    depends_on:
      - radio-hub
    restart: unless-stopped
    networks:
      - radio-host

  ais-decoder:
    build:
      context: ./decoder/ais
      dockerfile: Dockerfile
    profiles: ["ais", "all"]
    environment: *decoder-env
    volumes:
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/ais-decoder}}
    depends_on:
      - radio-hub
    restart: unless-stopped
    networks:
      - radio-host

  stub-decoder:
    build:
      context: ./decoder/stub
      dockerfile: Dockerfile
    profiles: ["decoder-stub"]
    environment:
      <<: *decoder-env
      PCM_PORT: "7370"
    volumes:
      - {type: volume, source: radio_host_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/stub-decoder}}
    depends_on:
      - radio-hub
    restart: unless-stopped
    networks:
      - radio-host

volumes:
  radio_hub_data:
  radio_host_credentials:

networks:
  radio-host:
    driver: bridge
