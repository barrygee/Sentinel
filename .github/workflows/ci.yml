# Continuous integration — lint, format, typecheck, build and test gates for the
# code contexts (backend Python, the Vue SPA, and root-level tooling/lint).
# Runs on every PR and on pushes to main. mypy is intentionally NOT a gate
# (informational only, ~90 known errors); ruff check IS gating.
#
# NOTE: the digital-decode sidecar image (decoder/Dockerfile) is intentionally
# NEVER built here. It compiles the patent-encumbered mbelib vocoder, which must
# not be built in CI or published; it is an opt-in local build only (compose
# `--profile voice-decoder`). Do not add a decoder build/publish step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv publishes no moving major tag (no `v8`), so pin the exact
        # release; it ships the Node 24 runtime.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Lint (ruff check)
        run: uv run --project backend ruff check backend services/sections services/radio

      - name: Format check (ruff format)
        run: uv run --project backend ruff format --check backend services/sections services/radio

      - name: Import boundaries (import-linter)
        # Sections may not import each other; core/platform may import no
        # section. Contracts live in backend/pyproject.toml [tool.importlinter].
        run: PYTHONPATH=. uv run --project backend lint-imports --config backend/pyproject.toml

      # socat lets test_decoder_adsb_entrypoint run the ADS-B decoder's real
      # pipeline (its stall timeout) instead of skipping.
      - name: Install socat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq socat

      - name: Tests (pytest)
        # pytest.ini sets pythonpath=. — run from the repo root, as documented.
        run: uv run --project backend pytest

  # The Vue SPA gates are split into themed jobs so each concern runs in
  # parallel, fails independently, and reports its own status: static analysis
  # (lint + typecheck), unit tests (vitest), the production build, and the live
  # a11y audit. The a11y job consumes the build's bundle via an artifact rather
  # than rebuilding it.
  frontend-vue-quality:
    name: frontend-vue / quality (eslint + vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

  frontend-vue-test:
    name: frontend-vue / test (vitest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Tests + coverage (vitest)
        # Coverage thresholds (vitest.config.ts) gate this — a ratchet raised to
        # 100% as the per-domain backfill lands. Includes the in-process jest-axe
        # accessibility test that ships with every component.
        run: npm run test:coverage

  frontend-vue-build:
    name: frontend-vue / build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Build (Vite)
        run: npm run build

      # Gate: the committed frontend/spa-dist/ must match what this source builds.
      #
      # Every other gate here builds its own bundle and tests that, so a stale
      # committed bundle passes all of them and only surfaces at runtime — the
      # backend serves the committed directory in production (SPA_DIR,
      # backend/core/app_sections.py), and docker compose bind-mounts it. That gap already shipped
      # twice: #238's dB-label fix was merged without a rebuild and had to be
      # re-released as #241, and #239 landed with its CSS change absent from the
      # bundle.
      #
      # `npm run build` above uses emptyOutDir, so it has just regenerated the
      # directory in place; any diff means the commit is missing its rebuild.
      # The `:/` pathspec anchors to the repo root regardless of working-directory.
      - name: Verify committed spa-dist matches this build
        run: |
          if [ -n "$(git status --porcelain -- ':/frontend/spa-dist')" ]; then
            echo "::error::frontend/spa-dist/ is stale — it does not match a build of this branch's source."
            echo ""
            echo "Fix: cd frontend/vue && npm run build, then commit frontend/spa-dist/."
            echo ""
            echo "Drift:"
            git status --short -- ':/frontend/spa-dist'
            exit 1
          fi
          echo "Committed bundle matches the build output."

      # Hand the built bundle to the a11y job so it serves the exact artifact
      # this job produced instead of rebuilding. Output dir is repo-root-relative
      # (vite.config.ts outDir: ../../frontend/spa-dist), so upload from root.
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v6
        with:
          name: spa-dist
          path: frontend/spa-dist/
          retention-days: 1

  frontend-vue-a11y:
    name: frontend-vue / a11y (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: frontend-vue-build
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      # Restore the bundle built by frontend-vue-build; `vite preview` serves it.
      - name: Download SPA bundle
        uses: actions/download-artifact@v6
        with:
          name: spa-dist
          path: frontend/spa-dist/

      # Live accessibility audit — runs the real axe-core engine in a browser
      # (WCAG 2.2 AA) over every domain view, catching the layout-dependent rules
      # jsdom-based jest-axe cannot (colour contrast, target size). Gating: fails
      # the job on any axe violation.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live a11y audit (Playwright + axe-core)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/vue/playwright-report/
          retention-days: 7

  web-packages:
    name: web-packages (eslint + typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The shared @sentinel/* packages under platform/web and the section
      # packages under services/sections/*/frontend (P4 of the
      # section-containers plan); scripts/web-packages.sh runs the script in
      # each. Every package gates its own coverage at 100%.
      - name: Lint (ESLint + Prettier)
        run: npm run web-packages -- lint

      - name: Typecheck
        run: npm run web-packages -- typecheck

      - name: Tests + coverage (vitest)
        run: npm run web-packages -- test:coverage

  multi-arch-build:
    name: multi-arch-build (backend amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # arm64 is emulated on the amd64 runner. The SPA stage runs natively
      # ($BUILDPLATFORM in backend/Dockerfile), so only the Python stage and the
      # pmtiles fetch pay the emulation cost.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Build only (`default` = the backend image) — nothing is pushed or loaded.
      # Catches an arm64-only break (a wheel without an aarch64 build, an
      # arch-specific download) before it reaches a Pi radio host. The decoder
      # images are never built in CI (mbelib — decoder/README.md).
      - name: Build backend image (docker buildx bake)
        uses: docker/bake-action@v7
        with:
          source: .
          set: |
            *.cache-from=type=gha,scope=multi-arch-build
            *.cache-to=type=gha,mode=max,scope=multi-arch-build

  root-tooling:
    name: root-tooling (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Lints the repo-root TypeScript files (config files + the full-stack e2e
      # specs under tests/e2e) — the context the backend and frontend-vue jobs
      # don't cover.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      # Type-checks the same surface. Gated here because the root context had no
      # tsconfig.json for a while, so `npm run typecheck` failed for everyone and
      # nothing noticed — a real type error had accumulated in the e2e specs.
      - name: Typecheck (tsc)
        run: npm run typecheck

      # Relative links and #anchors in docs/**, CONTRIBUTING.md and README.md,
      # plus every page docs/nav.json lists. The in-app docs (/doc) bundle these
      # files, so a dead link here is a dead link in the app.
      - name: Documentation links
        run: npm run check:doc-links

  # The composed stack (section-containers plan P5 exit): Caddy gateway + app +
  # NATS, built and started with docker compose exactly as deployed, then the
  # full-stack smoke suite driven THROUGH the gateway — plus the gateway-only
  # spec (/internal/ refused, CSP, unbuffered SSE, WebSocket upgrade).
  # The composed stack (app + gateway + NATS) driven through the gateway, once
  # per deployment of the sections (section-containers plan P6: "e2e green with
  # the section present *and* absent"). The app never hosts a section under
  # compose (P8c), so "absent" just means its container isn't started:
  #   sections-service  every section and the radio hub, as `docker compose up` runs them.
  #   sections-absent   only the SDR section's container, so the shell has a
  #                     section to show: Space, Land, Air, Sea and the hub are gone.
  #   sdr-absent        everything but the SDR section: the shell boots without
  #                     the SDR remote, whose audio engine it otherwise loads eagerly.
  gateway-smoke:
    name: gateway-smoke (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: sections-service
            services: app gateway nats space land air sea radio sdr
            sections: space:service,land:service,air:service,sea:service,radio:service,sdr:service
          - deployment: sections-absent
            services: app gateway nats sdr
            sections: space:absent,land:absent,air:absent,sea:absent,radio:absent,sdr:service
          - deployment: sdr-absent
            services: app gateway nats space land air sea radio
            sections: space:service,land:service,air:service,sea:service,radio:service,sdr:absent
    env:
      SENTINEL_E2E_SECTIONS: ${{ matrix.sections }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The containers drop to an unprivileged uid that must be able to write
      # the bind-mounted ./backend (the live config file): the runner's own.
      - name: Run the stack as the runner's user
        run: |
          echo "SENTINEL_RUNTIME_USER_ID=$(id -u)" >> "$GITHUB_ENV"
          echo "SENTINEL_RUNTIME_GROUP_ID=$(id -g)" >> "$GITHUB_ENV"

      # --wait returns once every container with a healthcheck reports healthy
      # (the app and each section service answer /health).
      - name: Build and start the composed stack
        run: docker compose up -d --build --wait ${{ matrix.services }}

      # Every container built from the app image must have dropped root. The
      # server is PID 1 (the entrypoint execs it); `exec id -u` would not do,
      # since exec runs as the image's user, which is root until the drop.
      - name: No backend container runs as root
        run: |
          for service in $(docker compose ps --services); do
            case "$service" in gateway|nats) continue ;; esac
            server_process_user_id=$(docker compose exec -T "$service" awk '/^Uid:/ { print $2 }' /proc/1/status)
            echo "$service runs as user id $server_process_user_id"
            if [ "$server_process_user_id" = "0" ]; then
              echo "::error::$service runs as root"
              exit 1
            fi
          done

      # Healthy is the app answering on its own port; this is the gateway
      # routing to it.
      - name: Wait for the app behind the gateway
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the app never became healthy behind the gateway"
          exit 1

      # Core's TLS service entrypoint (P7.5), for Sentinel processes on another
      # host: :8443 answers with a certificate the deployment CA issued for
      # `localhost`, refuses a client that doesn't trust that CA, and passes
      # /internal/ through to the app (401 without a credential), unlike :8080.
      - name: TLS service entrypoint
        run: |
          docker compose exec -T app cat /run/service-credentials/certificate-authority.pem > deployment-ca.pem
          health=$(curl -sS --cacert deployment-ca.pem -o /dev/null -w '%{http_code}' https://localhost:8443/health)
          internal=$(curl -sS --cacert deployment-ca.pem -o /dev/null -w '%{http_code}' \
            https://localhost:8443/internal/settings/secrets/sea/aisstreamApiKey)
          public_internal=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://localhost:8080/internal/settings/secrets/sea/aisstreamApiKey)
          echo "entrypoint /health $health, /internal/ $internal; public gateway /internal/ $public_internal"
          if [ "$health" != 200 ] || [ "$internal" != 401 ] || [ "$public_internal" != 404 ]; then
            echo "::error::the TLS service entrypoint answered unexpectedly"
            exit 1
          fi
          if curl -sS -o /dev/null https://localhost:8443/health 2>/dev/null; then
            echo "::error::the service entrypoint was trusted without the deployment CA"
            exit 1
          fi

      # A section container serves nothing until it has registered with the app
      # and the app has pushed its routes into the gateway. Waits for each
      # `<id>:service` in SENTINEL_E2E_SECTIONS: a section must be listed by
      # /api/app/sections, and every one must answer a route of its own.
      - name: Wait for the section services to register
        run: |
          declare -A probe_path=(
            [space]=/api/space/daynight [land]=/api/land/aprs/stations [air]=/api/air/tracking
            [sea]=/api/sea/ais-key [sdr]=/api/sdr/groups [radio]=/api/sdr/radios
          )
          services=$(echo "$SENTINEL_E2E_SECTIONS" | tr ',' '\n' | sed -n 's/:service$//p')
          all_registered() {
            sections=$(curl -fsS http://localhost:8080/api/app/sections || return 1)
            for service in $services; do
              # The radio hub is not a section, so it is never listed — only probed.
              if [ "$service" != radio ] && ! echo "$sections" | grep -q "\"id\":\"$service\""; then return 1; fi
              # JSON, not the SPA's index.html, which bare paths fall through to.
              curl -fsS "http://localhost:8080${probe_path[$service]}" | grep -q '^[[{]' || return 1
            done
          }
          for attempt in $(seq 1 90); do
            if all_registered; then exit 0; fi
            sleep 2
          done
          echo "::error::the section services ($services) never registered behind the gateway"
          exit 1

      - name: Full-stack smoke through the gateway
        run: npm run test:e2e:gateway

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs ${{ matrix.services }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-smoke-report-${{ matrix.deployment }}
          path: tests/e2e/playwright-report/
          retention-days: 7
