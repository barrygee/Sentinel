# Continuous integration — lint, format, typecheck, build and test gates for the
# code contexts (backend Python, the Vue SPA, and root-level tooling/lint).
# Runs on every PR and on pushes to main. mypy is intentionally NOT a gate
# (informational only, ~90 known errors); ruff check IS gating.
#
# NOTE: the digital-decode sidecar image (decoder/Dockerfile) is intentionally
# NEVER built here. It compiles the patent-encumbered mbelib vocoder, which must
# not be built in CI or published; it is an opt-in local build only (compose
# `--profile decoder`). Do not add a decoder build/publish step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv publishes no moving major tag (no `v8`), so pin the exact
        # release; it ships the Node 24 runtime.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Lint (ruff check)
        run: uv run --project backend ruff check backend

      - name: Format check (ruff format)
        run: uv run --project backend ruff format --check backend

      - name: Import boundaries (import-linter)
        # Sections may not import each other; core/platform may import no
        # section. Contracts live in backend/pyproject.toml [tool.importlinter].
        run: PYTHONPATH=. uv run --project backend lint-imports --config backend/pyproject.toml

      # socat lets test_decoder_adsb_entrypoint run the ADS-B decoder's real
      # pipeline (its stall timeout) instead of skipping.
      - name: Install socat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq socat

      - name: Tests (pytest)
        # pytest.ini sets pythonpath=. — run from the repo root, as documented.
        run: uv run --project backend pytest

  # The Vue SPA gates are split into themed jobs so each concern runs in
  # parallel, fails independently, and reports its own status: static analysis
  # (lint + typecheck), unit tests (vitest), the production build, and the live
  # a11y audit. The a11y job consumes the build's bundle via an artifact rather
  # than rebuilding it.
  frontend-vue-quality:
    name: frontend-vue / quality (eslint + vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

  frontend-vue-test:
    name: frontend-vue / test (vitest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Tests + coverage (vitest)
        # Coverage thresholds (vitest.config.ts) gate this — a ratchet raised to
        # 100% as the per-domain backfill lands. Includes the in-process jest-axe
        # accessibility test that ships with every component.
        run: npm run test:coverage

  frontend-vue-build:
    name: frontend-vue / build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      - name: Build (Vite)
        run: npm run build

      # Gate: the committed frontend/spa-dist/ must match what this source builds.
      #
      # Every other gate here builds its own bundle and tests that, so a stale
      # committed bundle passes all of them and only surfaces at runtime — the
      # backend serves the committed directory in production (backend/main.py
      # SPA_DIR), and docker compose bind-mounts it. That gap already shipped
      # twice: #238's dB-label fix was merged without a rebuild and had to be
      # re-released as #241, and #239 landed with its CSS change absent from the
      # bundle.
      #
      # `npm run build` above uses emptyOutDir, so it has just regenerated the
      # directory in place; any diff means the commit is missing its rebuild.
      # The `:/` pathspec anchors to the repo root regardless of working-directory.
      - name: Verify committed spa-dist matches this build
        run: |
          if [ -n "$(git status --porcelain -- ':/frontend/spa-dist')" ]; then
            echo "::error::frontend/spa-dist/ is stale — it does not match a build of this branch's source."
            echo ""
            echo "Fix: cd frontend/vue && npm run build, then commit frontend/spa-dist/."
            echo ""
            echo "Drift:"
            git status --short -- ':/frontend/spa-dist'
            exit 1
          fi
          echo "Committed bundle matches the build output."

      # Hand the built bundle to the a11y job so it serves the exact artifact
      # this job produced instead of rebuilding. Output dir is repo-root-relative
      # (vite.config.ts outDir: ../../frontend/spa-dist), so upload from root.
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v6
        with:
          name: spa-dist
          path: frontend/spa-dist/
          retention-days: 1

  frontend-vue-a11y:
    name: frontend-vue / a11y (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: frontend-vue-build
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/vue/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # One npm workspaces install at the repo root (frontend/vue is a member).
      - run: npm ci
        working-directory: .

      # Restore the bundle built by frontend-vue-build; `vite preview` serves it.
      - name: Download SPA bundle
        uses: actions/download-artifact@v6
        with:
          name: spa-dist
          path: frontend/spa-dist/

      # Live accessibility audit — runs the real axe-core engine in a browser
      # (WCAG 2.2 AA) over every domain view, catching the layout-dependent rules
      # jsdom-based jest-axe cannot (colour contrast, target size). Gating: fails
      # the job on any axe violation.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live a11y audit (Playwright + axe-core)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/vue/playwright-report/
          retention-days: 7

  web-packages:
    name: web-packages (eslint + typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The shared @sentinel/* packages under platform/web and the section
      # packages under services/sections/*/frontend (P4 of the
      # section-containers plan); scripts/web-packages.sh runs the script in
      # each. Every package gates its own coverage at 100%.
      - name: Lint (ESLint + Prettier)
        run: npm run web-packages -- lint

      - name: Typecheck
        run: npm run web-packages -- typecheck

      - name: Tests + coverage (vitest)
        run: npm run web-packages -- test:coverage

  root-tooling:
    name: root-tooling (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Lints the repo-root TypeScript files (config files + the full-stack e2e
      # specs under tests/e2e) — the context the backend and frontend-vue jobs
      # don't cover.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      # Type-checks the same surface. Gated here because the root context had no
      # tsconfig.json for a while, so `npm run typecheck` failed for everyone and
      # nothing noticed — a real type error had accumulated in the e2e specs.
      - name: Typecheck (tsc)
        run: npm run typecheck

  # The composed stack (section-containers plan P5 exit): Caddy gateway + app +
  # NATS, built and started with docker compose exactly as deployed, then the
  # full-stack smoke suite driven THROUGH the gateway — plus the gateway-only
  # spec (/internal/ refused, CSP, unbuffered SSE, WebSocket upgrade).
  # The composed stack (app + gateway + NATS) driven through the gateway, once
  # per deployment of the extracted sections (section-containers plan P6: "e2e
  # green with the section present *and* absent"):
  #   monolith          the app hosts every section, as `docker compose up` does.
  #   sections-service  Space and Land run in their own containers and the app
  #                     does NOT host them, so only the containers can answer.
  #   sections-absent   the app does not host them and no container runs them.
  gateway-smoke:
    name: gateway-smoke (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: monolith
            external_services: ''
            profiles: ''
            services: app gateway nats
            sections: ''
          - deployment: sections-service
            external_services: space,land
            profiles: space,land
            services: app gateway nats space land
            sections: space:service,land:service
          - deployment: sections-absent
            external_services: space,land
            profiles: ''
            services: app gateway nats
            sections: space:absent,land:absent
    env:
      SENTINEL_EXTERNAL_SERVICES: ${{ matrix.external_services }}
      COMPOSE_PROFILES: ${{ matrix.profiles }}
      SENTINEL_E2E_SECTIONS: ${{ matrix.sections }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start the composed stack
        run: docker compose up -d --build --wait ${{ matrix.services }}

      # The app container runs `uv run`, which syncs the venv before uvicorn
      # starts, so "running" is not "serving": wait for /health through the gateway.
      - name: Wait for the app behind the gateway
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the app never became healthy behind the gateway"
          exit 1

      # A section container serves nothing until it has registered with the app
      # and the app has pushed its routes into the gateway.
      - name: Wait for the section services to register
        if: matrix.deployment == 'sections-service'
        run: |
          for attempt in $(seq 1 90); do
            sections=$(curl -fsS http://localhost:8080/api/app/sections || true)
            if echo "$sections" | grep -q '"id":"space"' && echo "$sections" | grep -q '"id":"land"' \
              && curl -fsS -o /dev/null http://localhost:8080/api/space/daynight \
              && curl -fsS -o /dev/null http://localhost:8080/api/land/aprs/stations; then exit 0; fi
            sleep 2
          done
          echo "::error::the section services never registered behind the gateway"
          exit 1

      - name: Full-stack smoke through the gateway
        run: npm run test:e2e:gateway

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs ${{ matrix.services }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-smoke-report-${{ matrix.deployment }}
          path: tests/e2e/playwright-report/
          retention-days: 7
