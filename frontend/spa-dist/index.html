    <!-- Standard rel — Safari ignores the legacy "-precomposed" variant and falls
         back to the transparent-cornered favicon, which the macOS Dock/iOS home
         screen composite onto white (a visible white corner border). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Barlow-400.woff2" crossorigin />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/BarlowCondensed-400.woff2"
      crossorigin
    />
    <script>
      // Publish the palettes before first paint. The theme store owns both
      // attributes, but it is only created once the bundle has parsed — long
      // enough for a basemap change to show as a flash of the wrong one.
      // Kept deliberately tiny and dependency-free. The interface palette is
      // fixed dark; the map's is the operator's, stored as JSON, hence the
      // quoted form — the bare one is accepted too so a hand-set key works.
      try {
        document.documentElement.dataset.theme = 'dark'
        var _map = localStorage.getItem('sentinel_map_theme')
        var _mapTheme =
          _map === '"light"' || _map === 'light'
            ? 'light'
            : _map === '"colour"' || _map === 'colour'
              ? 'colour'
              : 'dark'
        document.documentElement.dataset.mapTheme = _mapTheme
      } catch (e) {}
    </script>
    <script>
      // Earliest possible AudioContext creation — captures user activation transferred
      // from the previous page before it expires. useSdrAudio picks up window._sdrEarlyCtx.
      if (sessionStorage && sessionStorage.getItem('sdrPlaying') === '1') {
        try {
          var _ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 })
          _ac.resume()
          window._sdrEarlyCtx = _ac
        } catch (e) {}
      }
    </script>
    <script type="module" crossorigin src="/spa-assets/index-D-NDHGFR.js"></script>
    <link rel="stylesheet" crossorigin href="/spa-assets/index-BeAJQ-tT.css">
