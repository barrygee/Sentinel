    <script>
      // Publish the palettes before first paint. The theme store owns both
      // attributes, but it is only created once the bundle has parsed — long
      // enough for a basemap change to show as a flash of the wrong one.
      // Kept deliberately tiny and dependency-free. The interface palette is
      // fixed dark; the map's is the operator's, stored as JSON, hence the
      // quoted form — the bare one is accepted too so a hand-set key works.
      try {
        document.documentElement.dataset.theme = 'dark'
        var _map = localStorage.getItem('sentinel_map_theme')
        // A retired "colour" choice is today's LIGHT map (COLOUR was renamed).
        var _mapTheme =
          _map === '"light"' || _map === 'light' || _map === '"colour"' || _map === 'colour'
            ? 'light'
            : 'dark'
        document.documentElement.dataset.mapTheme = _mapTheme
      } catch (e) {}
    </script>
