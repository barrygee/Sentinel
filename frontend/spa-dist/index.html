    <script>
      // Set the theme before first paint. The theme store is the owner of this
      // attribute, but it is only created once the bundle has parsed — long
      // enough for a light-theme user to get a full-screen flash of the dark
      // palette. Kept deliberately tiny and dependency-free. The store writes
      // the value as JSON, hence the quoted form; the bare one is accepted too
      // so a hand-set key still works.
      try {
        var _theme = localStorage.getItem('sentinel_theme')
        var _light = _theme === '"light"' || _theme === 'light'
        document.documentElement.dataset.theme = _light ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <script>
      // Earliest possible AudioContext creation — captures user activation transferred
      // from the previous page before it expires. useSdrAudio picks up window._sdrEarlyCtx.
      if (sessionStorage && sessionStorage.getItem('sdrPlaying') === '1') {
        try {
          var _ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 })
          _ac.resume()
          window._sdrEarlyCtx = _ac
