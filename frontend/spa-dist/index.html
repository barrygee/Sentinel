    <script>
      // Set the themes before first paint. The theme store owns both
      // attributes, but it is only created once the bundle has parsed — long
      // enough for a light-theme user to get a full-screen flash of the dark
      // palette. Kept deliberately tiny and dependency-free. The store writes
      // values as JSON, hence the quoted form; the bare one is accepted too so
      // a hand-set key still works.
      try {
        var _read = function (key) {
          var raw = localStorage.getItem(key)
          return raw === '"light"' || raw === 'light'
        }
        var _light = _read('sentinel_theme')
        document.documentElement.dataset.theme = _light ? 'light' : 'dark'
        // The map has its own key; before the two were split it had none, so
        // an absent key follows the interface exactly as the store's seed does.
        var _mapRaw = localStorage.getItem('sentinel_map_theme')
        var _mapLight = _mapRaw === null ? _light : _read('sentinel_map_theme')
        document.documentElement.dataset.mapTheme = _mapLight ? 'light' : 'dark'
      } catch (e) {}
    </script>

      // Earliest possible AudioContext creation — captures user activation transferred
