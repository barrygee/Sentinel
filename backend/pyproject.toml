    "backend.routers.space", "backend.services.satellite", "backend.services.tle", "backend.services.daynight",
    "backend.services.sat_radio", "backend.modules.space",
    "backend.routers.sea", "backend.services.ais_stream", "backend.services.ais_store", "backend.services.ais_decode",
    "backend.modules.sea",
    "backend.routers.land", "backend.services.aprs_store", "backend.services.repeaters", "backend.modules.land",
    "backend.radio_hub", "backend.modules.radio_hub",
]
ignore_imports = [
    # Recording start/stop drives IQ capture on the hub's broadcaster directly. Goes with the
    # hub.iq-capture.{start,stop} bus API (plan B12, P3).
    "backend.routers.sdr -> backend.radio_hub.services.sdr",
    "backend.routers.sdr -> backend.radio_hub.radios",
]

[[tool.importlinter.contracts]]
name = "Radio hub imports no section"
type = "forbidden"
