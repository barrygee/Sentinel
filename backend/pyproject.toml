[project]
name = "sentinel-backend"
version = "0.1.0"
description = "SENTINEL surveillance map — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.41.0",
    "jinja2>=3.1",
    "greenlet>=3.3.2",
    "sgp4>=2.23",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "aiofiles>=24.1",
    "websockets>=13",
    "pmtiles>=3.8.1",
    "nats-py>=2.9",
    # Each section's backend package (services/sections/<id>/backend) and the radio hub's
    # (services/radio/backend), installed editable.
    "sentinel-air",
    "sentinel-land",
    "sentinel-radio",
    "sentinel-sdr",
    "sentinel-sea",
    "sentinel-space",
]

[tool.uv.sources]
sentinel-air = { path = "../services/sections/air/backend", editable = true }
sentinel-land = { path = "../services/sections/land/backend", editable = true }
sentinel-radio = { path = "../services/radio/backend", editable = true }
sentinel-sdr = { path = "../services/sections/sdr/backend", editable = true }
sentinel-sea = { path = "../services/sections/sea/backend", editable = true }
sentinel-space = { path = "../services/sections/space/backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# Conservative ruleset — pyflakes + isort + a few high-signal pyupgrade checks.
# Skip rules that would force a large diff (formatting, naming style).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter, not enforced strictly
    "B008",   # FastAPI Depends() and Query() are explicit by design
    "E701",   # compact one-line while/if loops are clearer in some DSP/math contexts
    "UP047",  # PEP 695 generic-function syntax — cosmetic, defer
]

[tool.ruff.lint.per-file-ignores]
# main.py intentionally configures logging before importing modules that may
# emit log messages during their own initialisation.
"main.py" = ["E402"]

[tool.ruff.format]
# ruff format is the single source of Python formatting truth (adopted in the
# linting-foundation retrofit). Style matches Black: double quotes, space
# indentation, magic trailing commas honoured. Line length comes from
# [tool.ruff].line-length (120). CI runs `ruff format --check backend`.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
exclude = ["\\.venv", "__pycache__"]
explicit_package_bases = true
mypy_path = ".."
# Currently emits ~90 errors, mostly from SQLAlchemy 2.0 Column[T] vs unwrapped
# Python values on `row.field` access. Fixing requires annotating every ORM
# model with `Mapped[T]` (see models.py) — left for a follow-up. Settings below
# are the eventual target; mypy is wired up but not yet gating CI.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# ── Import boundaries (section-containers plan, P1) ───────────────────────────
# Each section may import core/platform/shared helpers, never another section;
# core and platform may import no section. Run from the repo root:
#   PYTHONPATH=. uv run --project backend lint-imports --config backend/pyproject.toml
#
# Direct imports only (allow_indirect_imports): backend/database.py still seeds
# section data, so through it every module "indirectly" reaches every section
# until the per-service DB split (P6). Each ignore_imports entry is a known
# crossing with the phase that removes it — delete the entry when it goes.
[tool.importlinter]
# Core plus each package that has moved out of backend/: the sections (services/sections/<id>/backend)
# and the radio hub (services/radio/backend).
root_packages = ["backend", "sentinel_air", "sentinel_land", "sentinel_radio", "sentinel_sdr", "sentinel_sea", "sentinel_space"]

[[tool.importlinter.contracts]]
name = "Core imports no section"
type = "forbidden"
allow_indirect_imports = true
# All of backend: sections and the radio hub run as services of their own, and
# only the test suite's in-process app (tests/in_process_app.py) imports them.
source_modules = [
    "backend",
]
# A developer script, never imported by the app: it regenerates Land's bundled
# repeater list (backend/data/uk_repeaters.json) with Land's own parser.
ignore_imports = [
    "backend.scripts.refresh_repeaters -> sentinel_land.services.repeaters",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_space",
    "sentinel_sea",
    "sentinel_land",
    "sentinel_sdr",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "Air imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_air",
]
forbidden_modules = [
    "sentinel_space",
    "sentinel_sea",
    "sentinel_land",
    "sentinel_sdr",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "Space imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_space",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_sea",
    "sentinel_land",
    "sentinel_sdr",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "Sea imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_sea",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_space",
    "sentinel_land",
    "sentinel_sdr",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "Land imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_land",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_space",
    "sentinel_sea",
    "sentinel_sdr",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "SDR section imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_sdr",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_space",
    "sentinel_sea",
    "sentinel_land",
    "sentinel_radio",
]

[[tool.importlinter.contracts]]
name = "Radio hub imports no section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "sentinel_radio",
]
forbidden_modules = [
    "sentinel_air",
    "sentinel_space",
    "sentinel_sea",
    "sentinel_land",
    "sentinel_sdr",
]
