[project]
name = "sentinel-backend"
version = "0.1.0"
description = "SENTINEL surveillance map — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.41.0",
    "jinja2>=3.1",
    "greenlet>=3.3.2",
    "sgp4>=2.23",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "aiofiles>=24.1",
    "websockets>=13",
    "pmtiles>=3.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
# Conservative ruleset — pyflakes + isort + a few high-signal pyupgrade checks.
# Skip rules that would force a large diff (formatting, naming style).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter, not enforced strictly
    "B008",   # FastAPI Depends() and Query() are explicit by design
    "E701",   # compact one-line while/if loops are clearer in some DSP/math contexts
    "UP047",  # PEP 695 generic-function syntax — cosmetic, defer
]

[tool.ruff.lint.per-file-ignores]
# main.py intentionally configures logging before importing modules that may
# emit log messages during their own initialisation.
"main.py" = ["E402"]

[tool.ruff.format]
# ruff format is the single source of Python formatting truth (adopted in the
# linting-foundation retrofit). Style matches Black: double quotes, space
# indentation, magic trailing commas honoured. Line length comes from
# [tool.ruff].line-length (120). CI runs `ruff format --check backend`.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
exclude = ["\\.venv", "__pycache__"]
explicit_package_bases = true
mypy_path = ".."
# Currently emits ~90 errors, mostly from SQLAlchemy 2.0 Column[T] vs unwrapped
# Python values on `row.field` access. Fixing requires annotating every ORM
# model with `Mapped[T]` (see models.py) — left for a follow-up. Settings below
# are the eventual target; mypy is wired up but not yet gating CI.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# ── Import boundaries (section-containers plan, P1) ───────────────────────────
# Each section may import core/platform/shared helpers, never another section;
# core and platform may import no section. Run from the repo root:
#   PYTHONPATH=. uv run --project backend lint-imports --config backend/pyproject.toml
#
# Direct imports only (allow_indirect_imports): backend/database.py still seeds
# section data, so through it every module "indirectly" reaches every section
# until the per-service DB split (P6). Each ignore_imports entry is a known
# crossing with the phase that removes it — delete the entry when it goes.
[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Core and platform import no section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "backend.core",
    "backend.platform",
    "backend.modules.core",
    "backend.routers.settings",
    "backend.routers.offline_map",
    "backend.services.app_config",
    "backend.services.app_config_file",
    "backend.services.offline_map",
]
forbidden_modules = [
    "backend.routers.air", "backend.routers.adsb_source", "backend.services.adsb", "backend.services.adsb_source",
    "backend.routers.space", "backend.services.satellite", "backend.services.tle", "backend.services.daynight",
    "backend.services.sat_radio", "backend.modules.space",
    "backend.routers.sea", "backend.services.ais_stream", "backend.services.ais_store", "backend.services.ais_decode",
    "backend.modules.sea",
    "backend.routers.land", "backend.services.aprs_store", "backend.services.repeaters", "backend.modules.land",
    "backend.routers.sdr", "backend.services.sdr_data", "backend.services.sdr_frequencies", "backend.modules.sdr",
    "backend.radio_hub", "backend.modules.radio_hub",
]

[[tool.importlinter.contracts]]
name = "Air imports no other section"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "backend.routers.air", "backend.routers.adsb_source", "backend.services.adsb", "backend.services.adsb_source",
]
forbidden_modules = [
    "backend.routers.space", "backend.services.satellite", "backend.services.tle", "backend.services.daynight",
    "backend.services.sat_radio", "backend.modules.space",
    "backend.routers.sea", "backend.services.ais_stream", "backend.services.ais_store", "backend.services.ais_decode",
    "backend.modules.sea",
    "backend.routers.land", "backend.services.aprs_store", "backend.services.repeaters", "backend.modules.land",
    "backend.routers.sdr", "backend.services.sdr_data", "backend.services.sdr_frequencies", "backend.modules.sdr",
    "backend.radio_hub", "backend.modules.radio_hub",
]

