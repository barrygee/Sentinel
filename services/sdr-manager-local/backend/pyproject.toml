# sdr-manager-local's backend: `sentinel_sdr_manager_local`, the RTL-SDRs plugged into this machine (ADR 0007).
# Installed editable into the backend venv as a path dependency of backend/pyproject.toml, so
# `uv run --project backend …` sees it like any other package. Its third-party dependencies stay
# declared in backend/pyproject.toml (one venv, one lock); it runs in its own image
# (services/sdr-manager-local/Dockerfile), not the shared backend one.
[project]
name = "sentinel-sdr-manager-local"
version = "0.1.0"
description = "SENTINEL SDR Manager (this machine's SDRs) backend"
requires-python = ">=3.12"
dependencies = []

# Runs SDR Manager as a native Mac process (ADR 0007):
# `uv run --project backend sdr-manager-local start|install|uninstall|status|doctor`.
[project.scripts]
sdr-manager-local = "sentinel_sdr_manager_local.cli:main_with_exit"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel_sdr_manager_local"
module-root = ""

[tool.ruff]
# Same rules and line length as the rest of the backend.
extend = "../../../backend/pyproject.toml"
# The vendored rtl_tcp relay is kept byte-for-byte as Sentry shipped it (Sentry
# architecture §2), so it is not linted or reformatted.
extend-exclude = ["sentinel_sdr_manager_local/relay/rtl_tcp_relay.py"]
