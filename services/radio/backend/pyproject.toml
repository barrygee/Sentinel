# The radio hub's backend: `sentinel_radio` (radio registry, routers, services, models, lifecycle, service entry point).
# Installed editable into the backend venv as a path dependency of backend/pyproject.toml, so
# `uv run --project backend …` and the image see it like any other package. Its third-party
# dependencies stay declared in backend/pyproject.toml for now (one venv, one lock).
[project]
name = "sentinel-radio"
version = "0.1.0"
description = "SENTINEL radio hub backend"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel_radio"
module-root = ""

[tool.ruff]
# Same rules and line length as the rest of the backend.
extend = "../../../backend/pyproject.toml"
