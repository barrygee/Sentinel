# Shared by every section that runs as its own service (section-containers
# plan P6): the app's image run with a standalone entry point, reachable only
# on the compose network (browsers reach it through the gateway).
x-section-service: &section-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  expose:
    - "8000"
  # Healthy = /health answers (the image's HEALTHCHECK). A section also holds
  # its own startup until core answers (create_service's wait_for_core), so
  # this only keeps compose's start order and `up --wait` honest.
  depends_on:
    app:
      condition: service_healthy
    nats:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - sentinel

# What every section service needs to join core. DB_PATH and
# SERVICE_INTERNAL_URL are set per service.
x-section-env: &section-env
  LEGACY_DB_PATH: /legacy/sentinel.db
  PYTHONUNBUFFERED: "1"
  SENTINEL_CORE_URL: http://app:8000
  NATS_URL: ${NATS_URL-tls://nats:4222}
  # Each service's own credentials, from its folder of the `service-credentials`
  # output (mounted per service): its HTTP token for core's internal routes,
  # its NATS user, and the CA the broker's certificate is checked against.
  SERVICE_HTTP_CREDENTIALS_FILE: /run/service-credentials/http-credentials.json
  NATS_CREDENTIALS_FILE: /run/service-credentials/nats-credentials.json
  NATS_CERTIFICATE_AUTHORITY_FILE: /run/service-credentials/certificate-authority.pem
  # The same CA, trusted for HTTPS to a hub on a radio host (the SDR section
  # fetches its IQ captures there — P7.5).
  INTERNAL_CERTIFICATE_AUTHORITY_FILE: /run/service-credentials/certificate-authority.pem
  # The unprivileged user the process runs as (see the app's entry below).
  SENTINEL_RUNTIME_USER_ID: ${SENTINEL_RUNTIME_USER_ID:-1000}
  SENTINEL_RUNTIME_GROUP_ID: ${SENTINEL_RUNTIME_GROUP_ID:-1000}

# Mounts every section service shares. The app's database is read once on
# first boot to copy the section's tables out (legacy import, opened read-only
# by the import); the SPA build holds each section's UI remote.
x-section-mounts:
  - &legacy-db sentinel_db:/legacy
  - &backend-code ./backend:/app/backend  # live-reload backend code
  - &spa-dist ./frontend/spa-dist:/app/frontend/spa-dist:ro

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-app
    # Internal only: browsers reach the app through the `gateway` service below,
    # which publishes :8080. Section services join core at http://app:8000
    # directly; decoders go through the gateway (see the decoder entries).
    expose:
      - "8000"

    # Lets this container address services listening on the DOCKER HOST as
    # `host.docker.internal`. Needed when Sentry runs on the same machine: it
    # uses `network_mode: host`, so it never joins this bridge network and has
    # no container-DNS name, while its per-dongle relays bind 0.0.0.0 on the
    # host. Configure an SDR device's host as `host.docker.internal` (the
    # host's LAN IP also works, but does not survive a DHCP change).
    #
    # `localhost` in an SDR device address would resolve to THIS container,
    # which is the mistake this entry exists to avoid.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - sentinel_db:/app/data
      - ./backend:/app/backend         # live-reload backend code
      - ./frontend/assets:/app/frontend/assets:ro  # tiles, sprites, fonts
      - ./frontend/spa-dist:/app/frontend/spa-dist:ro  # built Vue SPA
      # Its own credentials (`core`) and the callers it accepts, from service-credentials.
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/core}}
    environment:
      - DB_PATH=/app/data/sentinel.db
      # Internal routes (section-containers plan §4.5, P7.4b): services in their
      # own containers register, read their secret settings and fetch IQ
      # captures with their own credential, and decoders post with theirs.
      # The app knows them only by hash (accepted-callers.json); what each may
      # do is backend/platform/service_access.py. Generated by service-credentials.
      - SERVICE_HTTP_CREDENTIALS_FILE=/run/service-credentials/http-credentials.json
      - ACCEPTED_CALLERS_FILE=/run/service-credentials/accepted-callers.json
      # Sections the app must NOT host itself because they run in their own
      # containers (comma-separated, e.g. `space,land,air,sea,radio-hub,sdr`). A section container takes
      # its section over from the app anyway; listing it here also skips the
      # app's copy, and keeps the section gone when its container is stopped.
      - SENTINEL_EXTERNAL_SERVICES=${SENTINEL_EXTERNAL_SERVICES:-}
      - PYTHONUNBUFFERED=1
      # Digital-decode sidecar wiring (only used when the `decoder` profile runs).
      - DECODER_PCM_PORT=7355
      - DECODER_AUDIO_UDP_PORT=7356
      # APRS decode PCM feed (used only when the `aprs` profile runs). Distinct
      # from the voice feed's 7355 so voice + APRS can decode at once on two
      # dongles.
      - APRS_DECODER_PCM_PORT=7357
      # Off-grid AIS decode PCM feed (used only when the `ais` profile runs).
      # Distinct from voice (7355) and APRS (7357) so all three can decode at
      # once on three dongles. This feed is STEREO — one AIS channel per side.
      - AIS_DECODER_PCM_PORT=7358
      # Sea domain: AISStream.io key for live vessels (optional — the Sea map can
      # also take the key from Settings › SEA). Read from .env, never committed.
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      # Air domain: where Off Grid AIR reads decoded aircraft. Unset keeps the
      # backend default (the adsb-decoder sidecar below).
      - ADSB_OFFGRID_URL=${ADSB_OFFGRID_URL:-http://adsb-decoder:8080/data/aircraft.json}
      # Event bus broker (the `nats` service below). Events are always delivered
      # in-process first; NATS carries them to sections in other containers.
      # Set NATS_URL= (empty) in .env to run without a broker. TLS, with each
      # process signing in as its own NATS user (see `service-credentials` below).
      - NATS_URL=${NATS_URL-tls://nats:4222}
      - NATS_CREDENTIALS_FILE=/run/service-credentials/nats-credentials.json
      - NATS_CERTIFICATE_AUTHORITY_FILE=/run/service-credentials/certificate-authority.pem
      # The deployment CA, trusted for HTTPS to services on other hosts (health
      # probes of a radio host's hub — P7.5), and the gateway's own copy of it
      # (a path in the GATEWAY container) for proxying to them.
      - INTERNAL_CERTIFICATE_AUTHORITY_FILE=/run/service-credentials/certificate-authority.pem
      - GATEWAY_UPSTREAM_CERTIFICATE_AUTHORITY_FILE=/run/service-credentials/certificate-authority.pem
      # The gateway's admin API, which core pushes the service registry's routes
      # into. Set GATEWAY_ADMIN_URL= (empty) in .env to run without a gateway.
      - GATEWAY_ADMIN_URL=${GATEWAY_ADMIN_URL-http://gateway:2019}
      # The image never runs its process as root: the entrypoint hands the
      # volumes above to this uid/gid and drops to it. The default (1000) is the
      # image's own `sentinel` user. On a Linux host whose checkout is not owned
      # by uid 1000, set both to your ids (`id -u` / `id -g`) in .env, because
      # the ./backend bind mount is where the app writes sentinel_config.json.
      - SENTINEL_RUNTIME_USER_ID=${SENTINEL_RUNTIME_USER_ID:-1000}
      - SENTINEL_RUNTIME_GROUP_ID=${SENTINEL_RUNTIME_GROUP_ID:-1000}
    depends_on:
      nats:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - sentinel

  # The gateway (section-containers plan §4.4): Caddy, the one origin browsers
  # use. Its static config (gateway/caddy.json) never routes /internal/, sends
  # everything unmatched to the app, and turns an unreachable upstream into a
  # JSON 503. Every section / radio-hub / remote prefix is pushed into it at
  # runtime by the app from the service registry (backend/core/gateway_sync.py),
  # so moving a section into its own container needs no gateway edit. The
  # admin API (:2019) is reachable on the compose network only — never published.
  #
  # It also serves core's TLS service entrypoint on :8443 (P7.5): every path
  # straight to the app, /internal/ included, for Sentinel processes on another
  # host (a radio host's hub, a section elsewhere) to register, read settings
  # and their secrets. Not for browsers. Its certificate is issued by the
  # deployment CA (service-credentials) for `gateway`, `localhost` and
  # SENTINEL_CORE_HOSTNAMES. Published on 127.0.0.1 only unless
  # SENTINEL_SERVICE_ENTRYPOINT_ADDRESS opens it to the LAN (e.g. 0.0.0.0:8443).
  gateway:
    image: caddy:2.10-alpine
    container_name: sentinel-gateway
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    ports:
      - "8080:8080"
      - "${SENTINEL_SERVICE_ENTRYPOINT_ADDRESS:-127.0.0.1:8443}:8443"
    volumes:
      - ./gateway/caddy.json:/etc/caddy/caddy.json:ro
      # The entrypoint's certificate and key, and the CA it trusts when
      # proxying to a service registered at an https:// address.
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/gateway}}
    # Nothing to persist (its certificate comes from the volume above, and the
    # dynamic routes are re-pushed by the app), so run unprivileged on a
    # read-only filesystem with scratch space for Caddy's data/config dirs,
    # owned by that user (a root-owned tmpfs makes Caddy log a storage error).
    # The runtime user, because it owns the private key service-credentials wrote.
    user: "${SENTINEL_RUNTIME_USER_ID:-1000}:${SENTINEL_RUNTIME_GROUP_ID:-1000}"
    read_only: true
    tmpfs:
      - /data:uid=${SENTINEL_RUNTIME_USER_ID:-1000},gid=${SENTINEL_RUNTIME_GROUP_ID:-1000}
      - /config:uid=${SENTINEL_RUNTIME_USER_ID:-1000},gid=${SENTINEL_RUNTIME_GROUP_ID:-1000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_started
      service-credentials:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sentinel

  # The Space section as its own service (section-containers plan P6.1).
  # OPT-IN: only starts with `--profile space`. Same image as the app, run with
  # the standalone Space entry point (backend/standalone/space.py). On start it
  # registers with the app, which hands it /api/space/ and /remotes/space/ in
  # the gateway — no gateway edit, and the app's own copy of Space steps aside.
  # It keeps its tables (TLEs, the satellite catalogue) in its own database on
  # the space_data volume, copied from the app's database on first boot; its
  # settings stay in the app. Stop it (and restart the app) to roll back.
  space:
    <<: *section-service
    container_name: sentinel-space
    profiles: ["space"]
    volumes:
      - space_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/space}}
    environment:
      <<: *section-env
      DB_PATH: /app/data/space.db
      SERVICE_INTERNAL_URL: http://space:8000
    command: uvicorn backend.standalone.space:app --host 0.0.0.0 --port 8000 --reload

  # The Land section as its own service (P6.2). OPT-IN: `--profile land`.
  # Same pattern as `space`: registers with the app and takes /api/land/ and
  # /remotes/land/ over. Its tables (APRS stations, the repeater directory) live
  # in its own database on land_data, copied from the app's on first boot.
  # Decoded APRS packets reach it from the radio hub over NATS, so it needs the
  # `nats` service; APRS start/stop stays with the radio hub in the app.
  land:
    <<: *section-service
    container_name: sentinel-land
    profiles: ["land"]
    volumes:
      - land_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/land}}
    environment:
      <<: *section-env
      DB_PATH: /app/data/land.db
      SERVICE_INTERNAL_URL: http://land:8000
    command: uvicorn backend.standalone.land:app --host 0.0.0.0 --port 8000 --reload

  # The Air section as its own service (P6.3). OPT-IN: `--profile air`.
  # Same pattern as `space`/`land`: registers with the app and takes /api/air/
  # (core keeps /api/air/messages — notifications), /api/sdr/adsb/ and
  # /remotes/air/ over. Its tables (the ADS-B snapshot cache, tracked aircraft)
  # live in its own database on air_data, copied from the app's on first boot.
  # It asks the radio hub for Sentry reservations and the receiver's location,
  # and raises squawk alerts, over NATS — so it needs the `nats` service.
  air:
    <<: *section-service
    container_name: sentinel-air
    profiles: ["air"]
    volumes:
      - air_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/air}}
    environment:
      <<: *section-env
      DB_PATH: /app/data/air.db
      SERVICE_INTERNAL_URL: http://air:8000
      # Where Off Grid AIR reads decoded aircraft (same default as the app's).
      ADSB_OFFGRID_URL: ${ADSB_OFFGRID_URL:-http://adsb-decoder:8080/data/aircraft.json}
    command: uvicorn backend.standalone.air:app --host 0.0.0.0 --port 8000 --reload

  # The Sea section as its own service (P6.4). OPT-IN: `--profile sea`.
  # Same pattern as the sections above: registers with the app and takes
  # /api/sea/ and /remotes/sea/ over. Its tables (the vessel warm-start snapshot
  # and static data) live in its own database on sea_data, copied from the app's
  # on first boot. It holds the ONE AISStream connection a key allows, so list
  # `sea` in SENTINEL_EXTERNAL_SERVICES too or the app keeps a second one open.
  # The key saved in Settings › SEA stays in the app and is read over the app's
  # /internal/ route with Sea's own credential. Off-grid vessels (decode.ais.*)
  # and AIS receiver start/stop/status reach the radio hub over NATS, so it
  # needs `nats`.
  sea:
    <<: *section-service
    container_name: sentinel-sea
    profiles: ["sea"]
    volumes:
      - sea_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/sea}}
    environment:
      <<: *section-env
      DB_PATH: /app/data/sea.db
      SERVICE_INTERNAL_URL: http://sea:8000
      # The .env fallback key, used when none is saved in Settings › SEA (the
      # same variable the app reads when it hosts Sea itself). Never committed.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    command: uvicorn backend.standalone.sea:app --host 0.0.0.0 --port 8000 --reload

  # The radio hub as its own service (P6.5). OPT-IN: `--profile radio-hub`.
  # Same image and pattern as the sections above, but it is not a section: no
  # nav entry and no UI remote (the radio panes are the SDR section's). It owns
  # everything that touches a physical radio — rtl_tcp/Sentry IQ, radio CRUD,
  # connect/status, all four /ws/sdr/* sockets, the decode bridges and their
  # PCM ports, IQ capture and the Sentry fleet — and takes those prefixes over
  # from the app in the gateway when it registers. Its one table (the Sentry
  # hosts and their tokens) lives in its own database on radio_hub_data, copied
  # from the app's on first boot; the radios themselves stay an app setting.
  # Air, Sea, Land and the SDR section reach it over NATS.
  #
  # Decoders find it wherever it runs: their HTTP goes through the gateway,
  # and each config reply names the hub's PCM / voice-audio sockets by the
  # address it registered (SERVICE_INTERNAL_URL below). Running it here takes
  # the usual two .env lines, `radio-hub` in COMPOSE_PROFILES and
  # SENTINEL_EXTERNAL_SERVICES.
  radio-hub:
    <<: *section-service
    container_name: sentinel-radio-hub
    profiles: ["radio-hub"]
    # It dials rtl_tcp and Sentry hosts: same reason as the app's entry above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radio_hub_data:/app/data
      - *legacy-db
      - *backend-code
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/radio-hub}}
      # IQ captures are written to recordings/ on radio_hub_data; the SDR
      # section copies each one over HTTP when its recording stops (P7.3), so
      # no volume is shared with it.
    environment:
      <<: *section-env
      DB_PATH: /app/data/radio-hub.db
      SERVICE_INTERNAL_URL: http://radio-hub:8000
      # The decoders and the SDR section present their own credentials to the
      # hub; it knows them by hash. The PCM and voice ports keep the app's
      # defaults (7355–7358).
      ACCEPTED_CALLERS_FILE: /run/service-credentials/accepted-callers.json
    command: uvicorn backend.standalone.radio_hub:app --host 0.0.0.0 --port 8000 --reload

  # The SDR section as its own service (P6.6). OPT-IN: `--profile sdr`.
  # Same pattern as the sections above: registers with the app and takes
  # /api/sdr/ and /remotes/sdr/ over — only the rest of /api/sdr/ (stored
  # frequencies, groups, search ranges, band plan, recordings): the radio
  # hub's longer prefixes and Air's /api/sdr/adsb/ stay where they are. Its
  # tables live in its own database on sdr_data, copied from the app's on
  # first boot together with the recordings' WAV/IQ files. The band plan and
  # the other SDR settings stay in the app. Raw-IQ captures are started
  # and stopped on the radio hub over NATS; when one stops this service copies
  # the file from the hub over HTTP into recordings/ on this volume (P7.3).
  sdr:
    <<: *section-service
    container_name: sentinel-sdr
    profiles: ["sdr"]
    volumes:
      - sdr_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/sdr}}
    environment:
      <<: *section-env
      DB_PATH: /app/data/sdr.db
      SERVICE_INTERNAL_URL: http://sdr:8000
    command: uvicorn backend.standalone.sdr:app --host 0.0.0.0 --port 8000 --reload

  # Event bus broker (section-containers plan §3.3). NATS core only — no
  # JetStream, nothing persisted: consumers reconcile on restart. Carries only
  # low-rate control events (settings changes, decode events, hub requests);
  # FFT/IQ/PCM never go through it. Only Sentinel's own processes talk to it:
  # this host's containers, and a radio host's hub when one is set up.
  #
  # Clients connect over TLS (a CA generated for this deployment) and each
  # signs in as its own NATS user, allowed only the subjects it uses
  # (backend/platform/nats_permissions.py). service-credentials writes the config.
  nats:
    image: nats:2.11-alpine
    container_name: sentinel-nats
    # On 127.0.0.1 only unless NATS_PUBLISHED_ADDRESS opens it to the LAN
    # (e.g. 0.0.0.0:4222) for a radio host's hub (P7.5). TLS and a user per
    # service either way, so publishing it exposes nothing unauthenticated.
    ports:
      - "${NATS_PUBLISHED_ADDRESS:-127.0.0.1:4222}:4222"
    depends_on:
      service-credentials:
        condition: service_completed_successfully
    volumes:
      - {type: volume, source: service_credentials, target: /etc/nats-sentinel, read_only: true, volume: {subpath: server}}
    # The config also opens the monitoring port (8222, inside the network
    # only) for the healthcheck.
    command: ["--config", "/etc/nats-sentinel/nats.conf"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - sentinel

  # Generates every process's credentials on every `up`, then exits (plan
  # §4.5, P7.4): for the event bus, a CA for this deployment, the broker's TLS
  # certificate, one NATS user + password per service and nats.conf with each
  # user's subject permissions; for the internal HTTP routes, one token per
  # service and per decoder, and the hashes core and the radio hub accept
  # them by. Everything is kept on the service_credentials volume and only
  # created when missing. nats.conf and the accepted-callers lists are
  # regenerated each time, but the broker reads its config only at start:
  # after a permissions change, `docker compose restart nats`. Each service
  # and decoder mounts only its own services/<name>/ folder; the CA's private
  # key is never mounted elsewhere. See
  # backend/scripts/generate_service_credentials.py.
  service-credentials:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-service-credentials
    volumes:
      - service_credentials:/run/service-credentials
      - ./backend:/app/backend
    environment:
      # The entrypoint hands this folder to the runtime user, which then owns
      # every file the services read.
      SENTINEL_WRITABLE_DIRECTORIES: /run/service-credentials
      SENTINEL_RUNTIME_USER_ID: ${SENTINEL_RUNTIME_USER_ID:-1000}
      SENTINEL_RUNTIME_GROUP_ID: ${SENTINEL_RUNTIME_GROUP_ID:-1000}
      # Names (or IP addresses) other hosts reach THIS core host by,
      # comma-separated: the broker's and the service entrypoint's certificates
      # cover them (a radio host dialling core — P7.5).
      SENTINEL_CORE_HOSTNAMES: ${SENTINEL_CORE_HOSTNAMES:-}
      # Names (or IP addresses) core reaches a RADIO HOST by: when set, its
      # gateway's certificate is issued here (the CA key never leaves this host)
      # and exported with its bundle (backend/scripts/service_credentials_bundle.py).
      SENTINEL_RADIO_HOST_HOSTNAMES: ${SENTINEL_RADIO_HOST_HOSTNAMES:-}
    command: ["python", "-m", "backend.scripts.generate_service_credentials", "/run/service-credentials"]
    # A one-shot job, not a server.
    healthcheck:
      disable: true
    restart: "no"

  # Digital-voice decoder (dsd-fme). OPT-IN: it only builds/starts when you pass
  # `--profile decoder`, so it is never built by default or in CI. Building it
  # compiles the patent-encumbered mbelib vocoder locally (dsd-fme requires it);
  # the image stays on your machine. See decoder/README.md.
  decoder:
    build:
      context: ./decoder
      dockerfile: Dockerfile
    container_name: sentinel-decoder
    profiles: ["decoder", "all"]
    depends_on:
      - gateway
    environment:
      # Sentinel's gateway. Config and ingest go through it, so they reach the
      # radio hub wherever it runs (the app or the `radio-hub` service); each
      # config reply names the hub's PCM and voice-audio sockets, by the address the hub
      # registered, since raw TCP/UDP can't go through the gateway.
      - SENTINEL_GATEWAY_URL=${SENTINEL_GATEWAY_URL:-http://gateway:8080}
      # Its own credential, which the hub accepts for its kind only.
      - DECODER_CREDENTIALS_FILE=/run/service-credentials/http-credentials.json
    volumes:
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/voice-decoder}}
    # For a hardware AMBE dongle (license-clean alternative to software mbelib),
    # pass it through and add the matching dsd-fme flag via DSD_EXTRA_ARGS:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
    networks:
      - sentinel

  # APRS decoder (Direwolf). OPT-IN: only builds/starts with `--profile aprs`.
  # Direwolf is plain GPL software (no patent-encumbered vocoder), but it is still
  # gated so it is only built/run when APRS decode is wanted. It decodes
  # independently of the voice decoder, so both profiles can run together for
  # concurrent voice + APRS on two dongles. See decoder/aprs/README.md.
  aprs-decoder:
    build:
      context: ./decoder/aprs
      dockerfile: Dockerfile
    container_name: sentinel-aprs-decoder
    profiles: ["aprs", "all"]
    depends_on:
      - gateway
    environment:
      # Sentinel's gateway. Config and ingest go through it, so they reach the
      # radio hub wherever it runs (the app or the `radio-hub` service); each
      # config reply names the hub's PCM socket, by the address the hub
      # registered, since raw TCP can't go through the gateway.
      - SENTINEL_GATEWAY_URL=${SENTINEL_GATEWAY_URL:-http://gateway:8080}
      # Its own credential, which the hub accepts for its kind only.
      - DECODER_CREDENTIALS_FILE=/run/service-credentials/http-credentials.json
    volumes:
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/aprs-decoder}}
    restart: unless-stopped
    networks:
      - sentinel

  # Off-grid AIS decoder (Direwolf, AIS modem). OPT-IN: only builds/starts with
  # `--profile ais`. The Sea twin of aprs-decoder: same image base and the same
  # plain-GPL Direwolf (no patent-encumbered vocoder), but running Direwolf's
  # 9600 bps GMSK AIS modem on TWO channels at once.
  #
  # AIS ships alternate between channel A (161.975 MHz) and B (162.025 MHz), so
  # the backend demodulates both from one IQ span and serves them as interleaved
  # STEREO PCM (left = A, right = B); direwolf.conf runs an AIS modem on each.
  # Decoding a single channel would miss roughly half of all transmissions.
  #
  # This is the off-grid alternative to the online AISStream.io feed — decoded
  # vessels land in the same store, so the Sea map is identical either way. It
  # decodes independently of the voice and APRS decoders, so all three profiles
  # can run together on three dongles. See decoder/ais/README.md.
  ais-decoder:
    build:
      context: ./decoder/ais
      dockerfile: Dockerfile
    container_name: sentinel-ais-decoder
    profiles: ["ais", "all"]
    depends_on:
      - gateway
    environment:
      # Sentinel's gateway. Config and ingest go through it, so they reach the
      # radio hub wherever it runs (the app or the `radio-hub` service); each
      # config reply names the hub's PCM socket, by the address the hub
      # registered, since raw TCP can't go through the gateway.
      - SENTINEL_GATEWAY_URL=${SENTINEL_GATEWAY_URL:-http://gateway:8080}
      # Its own credential, which the hub accepts for its kind only.
      - DECODER_CREDENTIALS_FILE=/run/service-credentials/http-credentials.json
    volumes:
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/ais-decoder}}
    restart: unless-stopped
    networks:
      - sentinel

  # Stub decoder. OPT-IN: only builds/starts with `--profile decoder-stub` (and is
  # deliberately not in `all` — it decodes nothing). A stand-in decoder container
  # that follows the decoder contract for manifest-declared kinds — register,
  # poll config, read PCM, ingest — so the hub's side can be tested end to end
  # without mbelib or a real signal. See decoder/stub/README.md.
  stub-decoder:
    build:
      context: ./decoder/stub
      dockerfile: Dockerfile
    container_name: sentinel-stub-decoder
    profiles: ["decoder-stub"]
    depends_on:
      - gateway
    environment:
      # Sentinel's gateway. Config and ingest go through it, so they reach the
      # radio hub wherever it runs (the app or the `radio-hub` service); each
      # config reply names the hub's PCM socket, by the address the hub
      # registered, since raw TCP can't go through the gateway.
      - SENTINEL_GATEWAY_URL=${SENTINEL_GATEWAY_URL:-http://gateway:8080}
      # The PCM port its manifest declares (the hub listens on it).
      - PCM_PORT=7370
      # Its own credential, which the hub accepts for the `stub` kind only.
      - DECODER_CREDENTIALS_FILE=/run/service-credentials/http-credentials.json
    volumes:
      - {type: volume, source: service_credentials, target: /run/service-credentials, read_only: true, volume: {subpath: services/stub-decoder}}
    restart: unless-stopped
    networks:
      - sentinel

  # ADS-B decoder (readsb). OPT-IN: only builds/starts with `--profile adsb`.
  # Decodes 1090 MHz from a *remote* Sentry dongle: it reads the raw I/Q stream
  # from Sentry's rtl_tcp port and publishes `aircraft.json` for the air
  # domain's Off Grid source. AIR reads it at
  # http://adsb-decoder:8080/data/aircraft.json by default (ADSB_OFFGRID_URL in
  # .env overrides it for a decoder outside the compose network).
  #
  # NOTE: this pulls raw samples across the LAN — roughly 38 Mbps sustained at
  # 2.4 MSPS. Decoding on the Pi itself would cost a few KB/s instead; this
  # arrangement is chosen to keep the decoders in one stack.
  #
  # The Sentry device MUST already be tuned to 1090 MHz at 2.4 MSPS. This
  # container never retunes it — those are the operator's per-device settings
  # and another consumer may be relying on them. See decoder/adsb/README.md.
  adsb-decoder:
    build:
      context: ./decoder/adsb
      dockerfile: Dockerfile
    container_name: sentinel-adsb-decoder
    profiles: ["adsb", "all"]
    depends_on:
      - gateway
    environment:
      # Where the I/Q comes from is the operator's choice in Settings → AIR, not
      # a compose value: this is polled so changing the source device takes
      # effect at the next reconnect rather than needing the container recreated.
      # Through the gateway, so it reaches Air wherever Air runs (inside the
      # app, or the `air` service) — /api/sdr/adsb/ is Air's, not the app's.
      - CONFIG_URL=${SENTINEL_GATEWAY_URL:-http://gateway:8080}/api/sdr/adsb/config
      # Static fallback, for running this decoder standalone or before a source
      # has been picked. Leave unset to require the configured source.
      - RTL_TCP_HOST=${SENTINEL_ADSB_RTL_TCP_HOST:-}
      - RTL_TCP_PORT=${SENTINEL_ADSB_RTL_TCP_PORT:-2345}
      # Polled once at startup to report what the source device is tuned to, so
      # a mis-tuned dongle shows up in the logs rather than as an empty map.
      - SENTRY_API_BASE=${SENTINEL_ADSB_SENTRY_API:-http://192.168.5.67:8000}
      - JSON_DIR=/run/adsb/data
      - HTTP_PORT=8080
    # Published so the decoder can be checked from a browser and pointed at from
    # outside the compose network; Sentinel itself reaches it as `adsb-decoder`.
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks:
      - sentinel

  # rtl-tcp:
  #   image: kosdk/rtl-tcp
  #   container_name: rtl-tcp
  #   devices:
  #     - /dev/bus/usb:/dev/bus/usb
  #   ports:
  #     - "4321:4321"
  #   command: rtl_tcp -a 0.0.0.0 -p 4321
  #   restart: unless-stopped
  #   networks:
  #     - sentinel

volumes:
  sentinel_db:
  service_credentials:
  space_data:
  land_data:
  air_data:
  sea_data:
  radio_hub_data:
  sdr_data:

networks:
  sentinel:
    driver: bridge
