# Shared by every section that runs as its own service (section-containers
# plan P6): the app's image run with a standalone entry point, reachable only
# on the compose network (browsers reach it through the gateway).
x-section-service: &section-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  expose:
    - "8000"
  depends_on:
    - app
    - nats
  restart: unless-stopped
  networks:
    - sentinel

# What every section service needs to join core. DB_PATH and
# SERVICE_INTERNAL_URL are set per service.
x-section-env: &section-env
  LEGACY_DB_PATH: /legacy/sentinel.db
  PYTHONUNBUFFERED: "1"
  SENTINEL_CORE_URL: http://app:8000
  SENTINEL_JOIN_TOKEN: ${SENTINEL_JOIN_TOKEN:-}
  SENTINEL_JOIN_TOKEN_FILE: /run/sentinel/join-token
  NATS_URL: ${NATS_URL-nats://nats:4222}

# Mounts every section service shares. The app's database is read once on
# first boot to copy the section's tables out (legacy import, opened read-only
# by the import); the SPA build holds each section's UI remote.
x-section-mounts:
  - &legacy-db sentinel_db:/legacy
  - &backend-code ./backend:/app/backend  # live-reload backend code
  - &spa-dist ./frontend/spa-dist:/app/frontend/spa-dist:ro
  - &join-token-ro join_token:/run/sentinel:ro

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-app
    # Internal only: browsers reach the app through the `gateway` service below,
    # which publishes :8080. Sentinel's own containers (decoders) still use
    # http://app:8000 directly.
    expose:
      - "8000"

    # Lets this container address services listening on the DOCKER HOST as
    # `host.docker.internal`. Needed when Sentry runs on the same machine: it
    # uses `network_mode: host`, so it never joins this bridge network and has
    # no container-DNS name, while its per-dongle relays bind 0.0.0.0 on the
    # host. Configure an SDR device's host as `host.docker.internal` (the
    # host's LAN IP also works, but does not survive a DHCP change).
    #
    # `localhost` in an SDR device address would resolve to THIS container,
    # which is the mistake this entry exists to avoid.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - sentinel_db:/app/data
      - ./backend:/app/backend         # live-reload backend code
      - ./frontend/assets:/app/frontend/assets:ro  # tiles, sprites, fonts
      - ./frontend/spa-dist:/app/frontend/spa-dist:ro  # built Vue SPA
      - decoder_secret:/run/decoder    # shared auto-generated ingest secret
      - join_token:/run/sentinel       # shared auto-generated registry join token
    environment:
      - DB_PATH=/app/data/sentinel.db
      # Service registration (section-containers plan §3.2): sections running in
      # their own containers (e.g. the `space` profile) register with the app
      # using a join token. Unset, the app generates one into the shared
      # join_token volume on first start; set SENTINEL_JOIN_TOKEN in .env to pin it.
      - SENTINEL_JOIN_TOKEN=${SENTINEL_JOIN_TOKEN:-}
      - SENTINEL_JOIN_TOKEN_FILE=/run/sentinel/join-token
      # Sections the app must NOT host itself because they run in their own
      # containers (comma-separated, e.g. `space,land`). A section container takes
      # its section over from the app anyway; listing it here also skips the
      # app's copy, and keeps the section gone when its container is stopped.
      - SENTINEL_EXTERNAL_SERVICES=${SENTINEL_EXTERNAL_SERVICES:-}
      - PYTHONUNBUFFERED=1
      # Digital-decode sidecar wiring (only used when the `decoder` profile runs).
      # The ingest secret is auto-generated into /run/decoder (shared volume); no
      # configuration needed. Optionally pin it by setting SENTINEL_DECODER_SECRET
      # in .env (empty → use the auto-generated file).
      - DECODER_INGEST_SECRET=${SENTINEL_DECODER_SECRET:-}
      - DECODER_PCM_PORT=7355
      - DECODER_AUDIO_UDP_PORT=7356
      # APRS decode PCM feed (used only when the `aprs` profile runs). Distinct
      # from the voice feed's 7355 so voice + APRS can decode at once on two
      # dongles.
      - APRS_DECODER_PCM_PORT=7357
      # Off-grid AIS decode PCM feed (used only when the `ais` profile runs).
      # Distinct from voice (7355) and APRS (7357) so all three can decode at
      # once on three dongles. This feed is STEREO — one AIS channel per side.
      - AIS_DECODER_PCM_PORT=7358
      # Sea domain: AISStream.io key for live vessels (optional — the Sea map can
      # also take the key from Settings › SEA). Read from .env, never committed.
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      # Air domain: where Off Grid AIR reads decoded aircraft. Unset keeps the
      # backend default (the adsb-decoder sidecar below).
      - ADSB_OFFGRID_URL=${ADSB_OFFGRID_URL:-http://adsb-decoder:8080/data/aircraft.json}
      # Event bus broker (the `nats` service below). Events are always delivered
      # in-process first; NATS carries them to sections in other containers.
      # Set NATS_URL= (empty) in .env to run without a broker.
      - NATS_URL=${NATS_URL-nats://nats:4222}
      # The gateway's admin API, which core pushes the service registry's routes
      # into. Set GATEWAY_ADMIN_URL= (empty) in .env to run without a gateway.
      - GATEWAY_ADMIN_URL=${GATEWAY_ADMIN_URL-http://gateway:2019}
    depends_on:
      - nats
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - sentinel

  # The gateway (section-containers plan §4.4): Caddy, the one origin browsers
  # use. Its static config (gateway/caddy.json) never routes /internal/, sends
  # everything unmatched to the app, and turns an unreachable upstream into a
  # JSON 503. Every section / radio-hub / remote prefix is pushed into it at
  # runtime by the app from the service registry (backend/core/gateway_sync.py),
  # so moving a section into its own container needs no gateway edit. The
  # admin API (:2019) is reachable on the compose network only — never published.
  gateway:
    image: caddy:2.10-alpine
    container_name: sentinel-gateway
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/caddy.json:/etc/caddy/caddy.json:ro
    # Nothing to persist: no TLS certificates (plain HTTP on the LAN) and the
    # dynamic routes are re-pushed by the app, so run unprivileged on a
    # read-only filesystem with scratch space for Caddy's data/config dirs.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /data
      - /config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - sentinel

  # The Space section as its own service (section-containers plan P6.1).
  # OPT-IN: only starts with `--profile space`. Same image as the app, run with
  # the standalone Space entry point (backend/standalone/space.py). On start it
  # registers with the app, which hands it /api/space/ and /remotes/space/ in
  # the gateway — no gateway edit, and the app's own copy of Space steps aside.
  # It keeps its tables (TLEs, the satellite catalogue) in its own database on
  # the space_data volume, copied from the app's database on first boot; its
  # settings stay in the app. Stop it (and restart the app) to roll back.
  space:
    <<: *section-service
    container_name: sentinel-space
    profiles: ["space"]
    volumes:
      - space_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - *join-token-ro
    environment:
      <<: *section-env
      DB_PATH: /app/data/space.db
      SERVICE_INTERNAL_URL: http://space:8000
    command: uv run uvicorn backend.standalone.space:app --host 0.0.0.0 --port 8000 --reload

  # The Land section as its own service (P6.2). OPT-IN: `--profile land`.
  # Same pattern as `space`: registers with the app and takes /api/land/ and
  # /remotes/land/ over. Its tables (APRS stations, the repeater directory) live
  # in its own database on land_data, copied from the app's on first boot.
  # Decoded APRS packets reach it from the radio hub over NATS, so it needs the
  # `nats` service; APRS start/stop stays with the radio hub in the app.
  land:
    <<: *section-service
    container_name: sentinel-land
    profiles: ["land"]
    volumes:
      - land_data:/app/data
      - *legacy-db
      - *backend-code
      - *spa-dist
      - *join-token-ro
    environment:
      <<: *section-env
      DB_PATH: /app/data/land.db
      SERVICE_INTERNAL_URL: http://land:8000
    command: uv run uvicorn backend.standalone.land:app --host 0.0.0.0 --port 8000 --reload

  # Event bus broker (section-containers plan §3.3). NATS core only — no
  # JetStream, nothing persisted: consumers reconcile on restart. Carries only
  # low-rate control events (settings changes, decode events, hub requests);
  # FFT/IQ/PCM never go through it. Not published on the host — only
  # Sentinel's own containers talk to it.
  nats:
    image: nats:2.11-alpine
    container_name: sentinel-nats
    # -m: monitoring port for the healthcheck (inside the network only).
    command: ["--name", "sentinel", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - sentinel

  # Digital-voice decoder (dsd-fme). OPT-IN: it only builds/starts when you pass
  # `--profile decoder`, so it is never built by default or in CI. Building it
  # compiles the patent-encumbered mbelib vocoder locally (dsd-fme requires it);
  # the image stays on your machine. See decoder/README.md.
  decoder:
    build:
      context: ./decoder
      dockerfile: Dockerfile
    container_name: sentinel-decoder
    profiles: ["decoder", "all"]
    depends_on:
      - app
    environment:
      - INGEST_URL=http://app:8000/api/sdr/decode/ingest
      # Reads the auto-generated secret the backend wrote to the shared volume;
      # an explicit SENTINEL_DECODER_SECRET (if set) takes precedence.
      - INGEST_SECRET=${SENTINEL_DECODER_SECRET:-}
      - INGEST_SECRET_FILE=/run/decoder/secret
      - IQ_PCM_HOST=app
      - IQ_PCM_PORT=7355
      - AUDIO_UDP_HOST=app
      - AUDIO_UDP_PORT=7356
      # Polled before each dsd-fme launch to see whether a decode session is
      # active (the supervisor idles until one is).
      - CONFIG_URL=http://app:8000/api/sdr/decode/config
    volumes:
      - decoder_secret:/run/decoder:ro
    # For a hardware AMBE dongle (license-clean alternative to software mbelib),
    # pass it through and add the matching dsd-fme flag via DSD_EXTRA_ARGS:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
    networks:
      - sentinel

  # APRS decoder (Direwolf). OPT-IN: only builds/starts with `--profile aprs`.
  # Direwolf is plain GPL software (no patent-encumbered vocoder), but it is still
  # gated so it is only built/run when APRS decode is wanted. It decodes
  # independently of the voice decoder, so both profiles can run together for
  # concurrent voice + APRS on two dongles. See decoder/aprs/README.md.
  aprs-decoder:
    build:
      context: ./decoder/aprs
      dockerfile: Dockerfile
    container_name: sentinel-aprs-decoder
    profiles: ["aprs", "all"]
    depends_on:
      - app
    environment:
      - INGEST_URL=http://app:8000/api/sdr/aprs/ingest
      - CONFIG_URL=http://app:8000/api/sdr/aprs/config
      # Reads the auto-generated secret the backend wrote to the shared volume;
      # an explicit SENTINEL_DECODER_SECRET (if set) takes precedence.
      - INGEST_SECRET=${SENTINEL_DECODER_SECRET:-}
      - INGEST_SECRET_FILE=/run/decoder/secret
      - IQ_PCM_HOST=app
      - IQ_PCM_PORT=7357
    volumes:
      - decoder_secret:/run/decoder:ro
    restart: unless-stopped
    networks:
      - sentinel

  # Off-grid AIS decoder (Direwolf, AIS modem). OPT-IN: only builds/starts with
  # `--profile ais`. The Sea twin of aprs-decoder: same image base and the same
  # plain-GPL Direwolf (no patent-encumbered vocoder), but running Direwolf's
  # 9600 bps GMSK AIS modem on TWO channels at once.
  #
  # AIS ships alternate between channel A (161.975 MHz) and B (162.025 MHz), so
  # the backend demodulates both from one IQ span and serves them as interleaved
  # STEREO PCM (left = A, right = B); direwolf.conf runs an AIS modem on each.
  # Decoding a single channel would miss roughly half of all transmissions.
  #
  # This is the off-grid alternative to the online AISStream.io feed — decoded
  # vessels land in the same store, so the Sea map is identical either way. It
  # decodes independently of the voice and APRS decoders, so all three profiles
  # can run together on three dongles. See decoder/ais/README.md.
  ais-decoder:
    build:
      context: ./decoder/ais
      dockerfile: Dockerfile
    container_name: sentinel-ais-decoder
    profiles: ["ais", "all"]
    depends_on:
      - app
    environment:
      - INGEST_URL=http://app:8000/api/sdr/ais/ingest
      - CONFIG_URL=http://app:8000/api/sdr/ais/config
      # Reads the auto-generated secret the backend wrote to the shared volume;
      # an explicit SENTINEL_DECODER_SECRET (if set) takes precedence.
      - INGEST_SECRET=${SENTINEL_DECODER_SECRET:-}
      - INGEST_SECRET_FILE=/run/decoder/secret
      - IQ_PCM_HOST=app
      - IQ_PCM_PORT=7358
    volumes:
      - decoder_secret:/run/decoder:ro
    restart: unless-stopped
    networks:
      - sentinel

  # Stub decoder. OPT-IN: only builds/starts with `--profile decoder-stub` (and is
  # deliberately not in `all` — it decodes nothing). A stand-in decoder container
  # that follows the decoder contract for manifest-declared kinds — register,
  # poll config, read PCM, ingest — so the hub's side can be tested end to end
  # without mbelib or a real signal. See decoder/stub/README.md.
  stub-decoder:
    build:
      context: ./decoder/stub
      dockerfile: Dockerfile
    container_name: sentinel-stub-decoder
    profiles: ["decoder-stub"]
    depends_on:
      - app
    environment:
      - HUB_URL=http://app:8000
      - PCM_HOST=app
      - PCM_PORT=7370
      - INGEST_SECRET=${SENTINEL_DECODER_SECRET:-}
      - INGEST_SECRET_FILE=/run/decoder/secret
    volumes:
      - decoder_secret:/run/decoder:ro
    restart: unless-stopped
    networks:
      - sentinel

  # ADS-B decoder (readsb). OPT-IN: only builds/starts with `--profile adsb`.
  # Decodes 1090 MHz from a *remote* Sentry dongle: it reads the raw I/Q stream
  # from Sentry's rtl_tcp port and publishes `aircraft.json` for the air
  # domain's Off Grid source. AIR reads it at
  # http://adsb-decoder:8080/data/aircraft.json by default (ADSB_OFFGRID_URL in
  # .env overrides it for a decoder outside the compose network).
  #
  # NOTE: this pulls raw samples across the LAN — roughly 38 Mbps sustained at
  # 2.4 MSPS. Decoding on the Pi itself would cost a few KB/s instead; this
  # arrangement is chosen to keep the decoders in one stack.
  #
  # The Sentry device MUST already be tuned to 1090 MHz at 2.4 MSPS. This
  # container never retunes it — those are the operator's per-device settings
  # and another consumer may be relying on them. See decoder/adsb/README.md.
  adsb-decoder:
    build:
      context: ./decoder/adsb
      dockerfile: Dockerfile
    container_name: sentinel-adsb-decoder
    profiles: ["adsb", "all"]
    depends_on:
      - app
    environment:
      # Where the I/Q comes from is the operator's choice in Settings → AIR, not
      # a compose value: this is polled so changing the source device takes
      # effect at the next reconnect rather than needing the container recreated.
      - CONFIG_URL=http://app:8000/api/sdr/adsb/config
      # Static fallback, for running this decoder standalone or before a source
      # has been picked. Leave unset to require the configured source.
      - RTL_TCP_HOST=${SENTINEL_ADSB_RTL_TCP_HOST:-}
      - RTL_TCP_PORT=${SENTINEL_ADSB_RTL_TCP_PORT:-2345}
      # Polled once at startup to report what the source device is tuned to, so
      # a mis-tuned dongle shows up in the logs rather than as an empty map.
      - SENTRY_API_BASE=${SENTINEL_ADSB_SENTRY_API:-http://192.168.5.67:8000}
      - JSON_DIR=/run/adsb/data
      - HTTP_PORT=8080
    # Published so the decoder can be checked from a browser and pointed at from
    # outside the compose network; Sentinel itself reaches it as `adsb-decoder`.
    ports:
      - "8090:8080"
    restart: unless-stopped
    networks:
      - sentinel

  # rtl-tcp:
  #   image: kosdk/rtl-tcp
  #   container_name: rtl-tcp
  #   devices:
  #     - /dev/bus/usb:/dev/bus/usb
  #   ports:
  #     - "4321:4321"
  #   command: rtl_tcp -a 0.0.0.0 -p 4321
  #   restart: unless-stopped
  #   networks:
  #     - sentinel

volumes:
  sentinel_db:
  decoder_secret:
  join_token:
  space_data:
  land_data:

networks:
  sentinel:
    driver: bridge
