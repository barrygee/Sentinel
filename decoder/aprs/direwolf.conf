# Minimal receive-only Direwolf configuration for the Sentinel APRS sidecar.
#
# This file is NOT optional. Direwolf has no built-in fallback configuration: if
# it finds no config file in the working directory or $HOME it prints
#   ERROR - Could not open configuration file direwolf.conf in cwd or homedir.
# and calls exit(EXIT_FAILURE) before opening the audio device. Without it the
# supervisor's launch/retry loop respawned Direwolf every few seconds forever and
# not one packet was ever decoded. entrypoint.py passes it with `-c`.
#
# The audio format and modem are still set on the command line (see
# build_direwolf_command); Direwolf applies command-line options AFTER the config
# file, so those win. This file only supplies what Direwolf will not default.

# Audio in from stdin — the backend's 48 kHz mono s16 PCM feed, piped in by the
# supervisor. Audio out to ALSA's built-in `null` sink: this container has no
# sound hardware and we never transmit, but Direwolf opens an output device
# regardless and refuses to continue ("Pointless to continue without audio
# device") if it cannot.
ADEVICE stdin null

# One receive channel of 1200-baud AFSK (2 m APRS). Decoding needs no callsign;
# NOCALL keeps Direwolf from ever identifying as a real station.
ACHANNELS 1
CHANNEL 0
MYCALL NOCALL
MODEM 1200

# Nothing connects to Direwolf's TNC sockets — the supervisor parses stdout — so
# don't bind them.
AGWPORT 0
KISSPORT 0
