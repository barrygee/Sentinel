# Receive-only Direwolf configuration for the Sentinel off-grid AIS sidecar.
#
# This file is NOT optional. Direwolf has no built-in fallback configuration: if
# it finds no config file in the working directory or $HOME it prints
#   ERROR - Could not open configuration file direwolf.conf in cwd or homedir.
# and calls exit(EXIT_FAILURE) before opening the audio device. entrypoint.py
# passes it with `-c`.
#
# The audio format is still set on the command line (see build_direwolf_command);
# Direwolf applies command-line options AFTER the config file, so those win. This
# file supplies what Direwolf will not default — and, unlike the APRS sidecar's
# config, the TWO-channel setup, which has no command-line equivalent.

# Audio in from stdin — the backend's 48 kHz STEREO s16 PCM feed, piped in by the
# supervisor. Audio out to ALSA's built-in `null` sink: this container has no
# sound hardware and we never transmit, but Direwolf opens an output device
# regardless and refuses to continue ("Pointless to continue without audio
# device") if it cannot.
ADEVICE stdin null

# The whole point of the stereo feed. AIS ships alternate between two 25 kHz
# channels — A (161.975 MHz) and B (162.025 MHz) — so a single-channel decoder
# misses roughly half of all transmissions. The backend demodulates both from one
# IQ span and interleaves them, and Direwolf reads stdin as ACHANNELS-wide
# interleaved audio: left => channel 0 (AIS A), right => channel 1 (AIS B).
ACHANNELS 2

# Both channels run Direwolf's AIS modem: 9600 bps GMSK, which is why the feed
# must be wideband discriminator audio (the backend's FM-demod output) rather
# than anything that has been through a speaker/de-emphasis path.
#
# Decoding needs no callsign; NOCALL keeps Direwolf from ever identifying as a
# real station. Decoded frames are emitted on stdout as APRS user-defined data
# ("AIS>APDW16,NOGATE:{DA!AIVDM,..."), which the supervisor parses.
CHANNEL 0
MYCALL NOCALL
MODEM AIS

CHANNEL 1
MYCALL NOCALL
MODEM AIS

# Nothing connects to Direwolf's TNC sockets — the supervisor parses stdout — so
# don't bind them.
AGWPORT 0
KISSPORT 0
